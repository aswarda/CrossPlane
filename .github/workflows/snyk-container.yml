name: Snyk Container

on:
  push:
    branches: [ "aswarda" ]
  pull_request:
    branches: [ "aswarda" ]
  schedule:
    - cron: '* * * * *'

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # required for private repos

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build a Docker image
      run: docker build -t aswarda/new123 .

    - name: Run Snyk to check Docker image for vulnerabilities
      continue-on-error: true
      uses: snyk/actions/docker@14818c4695ecc4045f33c9cee9e795a788711ca4
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: aswarda/new123
        args: --file=Dockerfile --sarif-file-output=snyk.sarif

    - name: Check if SARIF file exists
      run: ls -lah snyk.sarif

    - name: Show SARIF content
      run: cat snyk.sarif

    - name: Install jq
      run: sudo apt update && sudo apt install -y jq

    - name: Fix SARIF file (replace null security values)
      run: |
        jq 'walk(if type == "object" and has("cvssv3_baseScore") and .["cvssv3_baseScore"] == null then .["cvssv3_baseScore"] = 0.0 else . end |
            if type == "object" and has("security-severity") and .["security-severity"] == "null" then .["security-severity"] = "0.0" else . end)' snyk.sarif > fixed_snyk.sarif
        mv fixed_snyk.sarif snyk.sarif

    - name: Show fixed SARIF content
      run: cat snyk.sarif

    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk.sarif
