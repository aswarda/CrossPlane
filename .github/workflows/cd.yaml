name: CD Pipeline

on:
  workflow_dispatch:  # Manually trigger from GitHub Actions
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    conclusions: [success]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Pull Docker image
      run: sudo docker pull aswarda/today:latest
    - name: Delete Old Docker Container
      run: sudo docker rm -f cicd-pipeline-container || true
    - name: Run Docker Container
      run: sudo docker run -d -p 8080:8080 --name cicd-pipeline-container aswarda/today
