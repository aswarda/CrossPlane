apiVersion: rds.aws.upbound.io/v1beta2  # Use v1beta2 based on your CRDs
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/instance
  labels:
    testing.upbound.io/example-name: example-dbinstance
  name: example-dbinstance-random
spec:
  forProvider:
    allocatedStorage: 20
    autoGeneratePassword: true
    autoMinorVersionUpgrade: true
    backupRetentionPeriod: 14
    backupWindow: 09:46-10:16
    dbName: example
    engine: postgres
    engineVersion: "16.6"
    instanceClass: db.t3.micro
    kmsKeyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: sample-key
    maintenanceWindow: Mon:00:00-Mon:03:00
    passwordSecretRef:
      key: password
      name: example-dbinstance
      namespace: upbound-system
    publiclyAccessible: false
    region: ap-south-1
    skipFinalSnapshot: true
    storageEncrypted: true
    storageType: gp2
    username: adminuser
    # Reference security group from the default VPC (ensure the security group is in the right VPC)
    vpcSecurityGroupIds:
      - sg-0ef36ba98e1d40f37  # Security group in the default VPC (ensure it's correct)
    # Use the correct VPC and subnet group
    dbSubnetGroupName: example-subnetgroup  # Reference the existing subnet group
  writeConnectionSecretToRef:
    name: example-dbinstance-out
    namespace: default
